name: gesband_mobile
description: Cliente móvil del MVP de Gesband.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_settings: 5.2.0
  dio: 5.8.0+1
  firebase_core: 3.12.1
  firebase_messaging: 15.2.4
  flutter_secure_storage: 9.2.4
  image_picker: 1.1.2
  intl: ^0.20.3
  shared_preferences: 2.5.3
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true

  # Licencias OFL de las fuentes; se muestran en «Licencias» (Mi ficha).
  assets:
    - assets/fonts/licenses/

  # Fuentes OFL de github.com/google/fonts, instanciadas solo en los pesos que
  # se usan (ver assets/fonts/README.md). Van empaquetadas para que la app
  # funcione sin conexión.
  fonts:
    - family: BigShouldersDisplay
      fonts:
        - asset: assets/fonts/BigShouldersDisplay-ExtraBold.ttf
          weight: 800
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: LibreCaslonText
      fonts:
        - asset: assets/fonts/LibreCaslonText-Regular.ttf
          weight: 400
        - asset: assets/fonts/LibreCaslonText-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/LibreCaslonText-Bold.ttf
          weight: 700
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
