openapi: 3.1.0
info:
  title: Gesband API
  version: 0.1.0
  summary: Contrato del MVP para la gestión operativa de asociaciones musicales.
  description: |
    API privada y multi-asociación de Gesband. Los ejemplos son sintéticos.
    Los campos económicos, la monetización y el complemento web público quedan fuera.
    Cada operación restringida declara permisos orientativos mediante `x-permissions`;
    el servidor siempre valida la cuenta, asociación y relaciones completas.
servers:
  - url: https://api.example.invalid/api/v1
    description: Ejemplo; no representa un entorno real.
tags:
  - name: Auth
  - name: Associations
  - name: Catalogues
  - name: Members
  - name: Imports
  - name: Activities
  - name: Invitations
  - name: Attendance
  - name: Transport
  - name: Notifications
  - name: Devices
  - name: Polls
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Inicia sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            examples:
              synthetic:
                value: {email: marina@example.invalid, password: synthetic-password}
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rota el token de renovación y emite un acceso nuevo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string, minLength: 20, writeOnly: true}
      responses:
        '200':
          description: Tokens rotados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoca la sesión y los dispositivos indicados.
      description: La app elimina además su caché local de asociaciones.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string, minLength: 20, writeOnly: true}
                device_id: {$ref: '#/components/schemas/Uuid'}
      responses:
        '204': {description: Sesión revocada; respuesta repetible.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/password-reset-requests:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Solicita recuperación sin revelar si la cuenta existe.
      security: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202': {description: Solicitud aceptada en todos los casos.}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentAccount
      summary: Devuelve la identidad y asociaciones disponibles.
      responses:
        '200':
          description: Cuenta autenticada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentAccount'}
              examples:
                twoAssociations:
                  value:
                    id: 00000000-0000-4000-8000-000000000001
                    display_name: Marina Soler
                    email: marina@example.invalid
                    locale: ca-ES-valencia
                    associations:
                      - {id: 10000000-0000-4000-8000-000000000001, name: Unió Musical Exemple, permissions: [association.view, activities.view, notifications.view, devices.manage_own, polls.view, polls.manage]}
                      - {id: 10000000-0000-4000-8000-000000000002, name: Banda La Mostra, permissions: [association.view, members.view, activities.view]}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /associations:
    get:
      tags: [Associations]
      operationId: listMyAssociations
      summary: Lista asociaciones accesibles para seleccionar la activa.
      responses:
        '200':
          description: Asociaciones de la cuenta, sin paginar por ser un conjunto acotado.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: {type: array, items: {$ref: '#/components/schemas/AssociationMembership'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /association:
    get:
      tags: [Associations]
      operationId: getActiveAssociation
      summary: Consulta la asociación activa.
      x-permissions: [association.view]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
      responses:
        '200':
          description: Asociación activa.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Association'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Associations]
      operationId: updateActiveAssociation
      summary: Edita la identidad y configuración de la asociación activa.
      x-permissions: [association.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/AssociationUpdate'}
      responses:
        '200':
          description: Asociación actualizada.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Association'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /instruments:
    get:
      tags: [Catalogues]
      operationId: listInstruments
      summary: Lista instrumentos de la asociación activa.
      x-permissions: [members.view]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de instrumentos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstrumentPage'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Catalogues]
      operationId: createInstrument
      summary: Crea un instrumento local.
      x-permissions: [members.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogueItemInput'}
      responses:
        '201':
          description: Instrumento creado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Instrument'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sections:
    get:
      tags: [Catalogues]
      operationId: listSections
      summary: Lista cuerdas o secciones de la asociación activa.
      x-permissions: [members.view]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de cuerdas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SectionPage'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Catalogues]
      operationId: createSection
      summary: Crea una cuerda o sección local.
      x-permissions: [members.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CatalogueItemInput'}}}
      responses:
        '201':
          description: Sección creada.
          content: {application/json: {schema: {$ref: '#/components/schemas/Section'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: Lista fichas visibles de la asociación activa.
      description: Los campos privados se omiten si falta `members.private_data.view`.
      x-permissions: [members.view]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/MemberStatus'}}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: instrument_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: section_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200':
          description: Página de miembros.
          content: {application/json: {schema: {$ref: '#/components/schemas/MemberPage'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Members]
      operationId: createMember
      summary: Crea una ficha local sin crear necesariamente una cuenta.
      x-permissions: [members.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberInput'}
            examples:
              musician:
                value:
                  given_name: Pau
                  family_name: Ferrer Vidal
                  member_type: musician
                  status: active
                  email: pau@example.invalid
                  phone: '+34960000001'
                  section_id: 20000000-0000-4000-8000-000000000001
                  instruments:
                    - {instrument_id: 21000000-0000-4000-8000-000000000001, is_primary: true}
      responses:
        '201':
          description: Ficha creada.
          content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /members/{memberId}:
    parameters:
      - {$ref: '#/components/parameters/MemberId'}
    get:
      tags: [Members]
      operationId: getMember
      summary: Consulta una ficha local.
      x-permissions: [members.view]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
      responses:
        '200':
          description: Ficha visible según permisos.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Members]
      operationId: updateMember
      summary: Edita una ficha; el músico propio solo puede cambiar campos autorizados.
      x-permissions: [members.manage, self-limited]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/MemberUpdate'}
      responses:
        '200':
          description: Ficha actualizada.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /members/{memberId}/photo:
    parameters:
      - {$ref: '#/components/parameters/MemberId'}
      - {$ref: '#/components/parameters/AssociationId'}
    get:
      tags: [Members]
      operationId: downloadMemberPhoto
      summary: Descarga una foto privada tras autorizar cada solicitud.
      x-permissions: [members.photo.view, self]
      responses:
        '200':
          description: Imagen normalizada; nunca una ruta pública permanente.
          headers:
            Cache-Control:
              schema: {type: string, const: private, description: La implementación puede añadir max-age breve.}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Members]
      operationId: replaceMemberPhoto
      summary: Valida, normaliza y sustituye la foto privada.
      description: Acepta JPEG, PNG o WebP, máximo 5 MiB; elimina metadatos y limita dimensiones/píxeles decodificados.
      x-permissions: [members.photo.manage, self]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Metadatos de foto actualizados.
          content: {application/json: {schema: {$ref: '#/components/schemas/PhotoMetadata'}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Members]
      operationId: deleteMemberPhoto
      summary: Elimina la foto privada y sus derivados.
      x-permissions: [members.photo.manage, self]
      responses:
        '204': {description: Foto eliminada.}
        '404': {$ref: '#/components/responses/NotFound'}
  /member-imports:
    get:
      tags: [Imports]
      operationId: listMemberImports
      summary: Lista lotes de importación sin exponer el fichero original.
      x-permissions: [imports.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de lotes.
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportBatchPage'}}}
    post:
      tags: [Imports]
      operationId: previewMemberImport
      summary: Carga CSV/XLSX y crea una previsualización sin modificar el censo.
      description: No ejecuta macros o fórmulas, ni descarga URLs. El mapeo usa nombres de campo permitidos.
      x-permissions: [imports.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, column_mapping]
              properties:
                file: {type: string, format: binary}
                column_mapping:
                  type: string
                  description: Objeto JSON serializado que asocia columna con campo permitido.
                  examples: ['{"Nombre":"given_name","Apellidos":"family_name","Instrumento":"instrument_name"}']
      responses:
        '202':
          description: Análisis aceptado; consultar el lote hasta estado `preview_ready` o `failed`.
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportBatch'}}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /member-imports/{importId}:
    get:
      tags: [Imports]
      operationId: getMemberImport
      summary: Consulta previsualización e informe por fila.
      x-permissions: [imports.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/ImportId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Lote y página de filas analizadas.
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportBatchDetail'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /member-imports/{importId}/confirm:
    post:
      tags: [Imports]
      operationId: confirmMemberImport
      summary: Confirma exactamente la revisión indicada y aplica cambios.
      description: No envía invitaciones. Repetir la misma clave devuelve el mismo resultado.
      x-permissions: [imports.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/ImportId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_version]
              properties:
                preview_version: {type: integer, minimum: 1}
                explicit_matches:
                  type: object
                  additionalProperties: {$ref: '#/components/schemas/Uuid'}
                  description: Mapa de identificador de fila a miembro existente elegido explícitamente.
      responses:
        '202':
          description: Aplicación aceptada.
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportBatch'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities:
    get:
      tags: [Activities]
      operationId: listActivities
      summary: Lista agenda visible en la asociación activa.
      x-permissions: [activities.view]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: starts_from, in: query, schema: {type: string, format: date-time}}
        - {name: starts_until, in: query, schema: {type: string, format: date-time}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/ActivityType'}}
      responses:
        '200':
          description: Página de actividades.
          content: {application/json: {schema: {$ref: '#/components/schemas/ActivityPage'}}}
    post:
      tags: [Activities]
      operationId: createActivity
      summary: Crea un borrador de ensayo o actuación.
      x-permissions: [activities.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivityInput'}
            examples:
              concert:
                value:
                  type: performance
                  title: Concert de tardor
                  starts_at: '2026-10-17T17:00:00Z'
                  gathering_at: '2026-10-17T16:15:00Z'
                  location: {name: Auditori Municipal, address: 'Plaça Exemple, 1'}
                  uniform: Uniforme complet
                  response_deadline: '2026-10-12T21:59:00Z'
                  programme:
                    - {position: 1, title: Obertura de mostra, notes: Versió revisada}
      responses:
        '201':
          description: Borrador creado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Activity'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/{activityId}:
    parameters:
      - {$ref: '#/components/parameters/ActivityId'}
      - {$ref: '#/components/parameters/AssociationId'}
    get:
      tags: [Activities]
      operationId: getActivity
      summary: Consulta una actividad visible.
      x-permissions: [activities.view]
      responses:
        '200':
          description: Actividad con programa y resumen permitido.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Activity'}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Activities]
      operationId: updateActivity
      summary: Edita actividad y genera avisos si cambia información relevante.
      description: Un cambio de fecha o lugar puede incrementar `invitation_revision` y requerir nueva respuesta.
      x-permissions: [activities.manage]
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/ActivityUpdate'}}}
      responses:
        '200':
          description: Actividad actualizada.
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Activity'}}}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/{activityId}/publish:
    post:
      tags: [Activities]
      operationId: publishActivity
      summary: Publica una actividad interna; no la publica en una web pública.
      x-permissions: [activities.manage]
      parameters:
        - {$ref: '#/components/parameters/ActivityId'}
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Actividad publicada.
          content: {application/json: {schema: {$ref: '#/components/schemas/Activity'}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /activities/{activityId}/cancel:
    post:
      tags: [Activities]
      operationId: cancelActivity
      summary: Cancela y conserva el historial; crea avisos a personas afectadas.
      x-permissions: [activities.manage]
      parameters:
        - {$ref: '#/components/parameters/ActivityId'}
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: {reason: {type: string, minLength: 1, maxLength: 500}}
      responses:
        '200':
          description: Actividad cancelada.
          content: {application/json: {schema: {$ref: '#/components/schemas/Activity'}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /activities/{activityId}/invitation-preview:
    post:
      tags: [Invitations]
      operationId: previewInvitations
      summary: Resuelve destinatarios sin crear convocatorias.
      x-permissions: [invitations.manage]
      parameters:
        - {$ref: '#/components/parameters/ActivityId'}
        - {$ref: '#/components/parameters/AssociationId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationSelection'}}}
      responses:
        '200':
          description: Destinatarios únicos y resumen por cuerda/instrumento.
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationPreview'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/{activityId}/invitations:
    get:
      tags: [Invitations]
      operationId: listActivityInvitations
      summary: Lista convocatorias; un músico sin permiso de grupo solo ve la propia.
      x-permissions: [activities.view, invitations.manage-or-self]
      parameters:
        - {$ref: '#/components/parameters/ActivityId'}
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de convocatorias.
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationPage'}}}
    post:
      tags: [Invitations]
      operationId: createActivityInvitations
      summary: Crea o conserva una convocatoria única por miembro y revisión.
      description: Genera avisos persistentes de forma recuperable; los fallos de proveedor no revierten las convocatorias.
      x-permissions: [invitations.manage]
      parameters:
        - {$ref: '#/components/parameters/ActivityId'}
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationSelection'}}}
      responses:
        '202':
          description: Convocatorias creadas y comunicaciones encoladas.
          content: {application/json: {schema: {$ref: '#/components/schemas/InvitationBatchResult'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /invitations/{invitationId}/response:
    put:
      tags: [Invitations]
      operationId: answerInvitation
      summary: Registra o reemplaza la respuesta propia para la revisión vigente.
      description: Es idempotente por contenido y nunca registra asistencia real.
      x-permissions: [self]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/InvitationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvitationResponseInput'}
            examples:
              accepted: {value: {status: accepted, comment: Arribaré amb el meu cotxe.}}
      responses:
        '200':
          description: Respuesta vigente, confirmada por servidor.
          content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/{activityId}/attendance:
    get:
      tags: [Attendance]
      operationId: listAttendance
      summary: Lista asistencia real y resumen permitido.
      x-permissions: [attendance.manage]
      parameters:
        - {$ref: '#/components/parameters/ActivityId'}
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Página de registros de asistencia.
          content: {application/json: {schema: {$ref: '#/components/schemas/AttendancePage'}}}
    put:
      tags: [Attendance]
      operationId: recordAttendance
      summary: Registra asistencia real en bloque y conserva trazabilidad.
      x-permissions: [attendance.manage]
      parameters:
        - {$ref: '#/components/parameters/ActivityId'}
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items: {$ref: '#/components/schemas/AttendanceInput'}
      responses:
        '200':
          description: Registros vigentes.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties: {results: {type: array, items: {$ref: '#/components/schemas/Attendance'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /activities/{activityId}/transports:
    get:
      tags: [Transport]
      operationId: listActivityTransports
      summary: Lista medios visibles para la actividad.
      x-permissions: [transport.view]
      parameters:
        - {$ref: '#/components/parameters/ActivityId'}
        - {$ref: '#/components/parameters/AssociationId'}
      responses:
        '200':
          description: Medios y ocupación.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties: {results: {type: array, items: {$ref: '#/components/schemas/Transport'}}}
    post:
      tags: [Transport]
      operationId: createTransport
      summary: Añade un medio de transporte a una actuación.
      x-permissions: [transport.manage]
      parameters:
        - {$ref: '#/components/parameters/ActivityId'}
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TransportInput'}}}
      responses:
        '201':
          description: Medio creado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Transport'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /transports/{transportId}/assignments:
    get:
      tags: [Transport]
      operationId: listTransportAssignments
      summary: Lista asignaciones; un músico sin gestión solo ve la propia.
      x-permissions: [transport.view, self]
      parameters:
        - {$ref: '#/components/parameters/TransportId'}
        - {$ref: '#/components/parameters/AssociationId'}
      responses:
        '200':
          description: Asignaciones visibles.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties: {results: {type: array, items: {$ref: '#/components/schemas/TransportAssignment'}}}
    post:
      tags: [Transport]
      operationId: assignTransport
      summary: Asigna una persona comprobando actividad, duplicados y capacidad.
      x-permissions: [transport.manage]
      parameters:
        - {$ref: '#/components/parameters/TransportId'}
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_id]
              properties: {member_id: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '201':
          description: Asignación creada.
          content: {application/json: {schema: {$ref: '#/components/schemas/TransportAssignment'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /transports/{transportId}/assignments/{assignmentId}:
    delete:
      tags: [Transport]
      operationId: removeTransportAssignment
      summary: Elimina una asignación.
      x-permissions: [transport.manage]
      parameters:
        - {$ref: '#/components/parameters/TransportId'}
        - {$ref: '#/components/parameters/AssignmentId'}
        - {$ref: '#/components/parameters/AssociationId'}
      responses:
        '204': {description: Asignación eliminada.}
        '404': {$ref: '#/components/responses/NotFound'}
  /notifications:
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      summary: Lista avisos persistentes propios de la asociación activa.
      x-permissions: [notifications.view]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: unread, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Avisos sin datos personales completos ni tokens.
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}
  /notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Marca un aviso propio como leído.
      x-permissions: [notifications.view]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/NotificationId'}
      responses:
        '200':
          description: Aviso actualizado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /devices:
    get:
      tags: [Devices]
      operationId: listMyDevices
      summary: Lista instalaciones propias sin revelar tokens push.
      x-permissions: [devices.manage_own]
      responses:
        '200':
          description: Dispositivos de la cuenta autenticada.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties: {results: {type: array, items: {$ref: '#/components/schemas/DeviceRegistration'}}}
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Registra o rota el token de una instalación propia.
      description: La instalación pertenece a una sola cuenta activa; al cambiar de cuenta se revoca el vínculo anterior.
      x-permissions: [devices.manage_own]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeviceRegistrationInput'}}}
      responses:
        '200':
          description: Instalación ya existente actualizada.
          content: {application/json: {schema: {$ref: '#/components/schemas/DeviceRegistration'}}}
        '201':
          description: Instalación registrada.
          content: {application/json: {schema: {$ref: '#/components/schemas/DeviceRegistration'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /devices/{deviceId}:
    patch:
      tags: [Devices]
      operationId: updateDeviceState
      summary: Informa del permiso observado o renueva el token de la instalación propia.
      x-permissions: [devices.manage_own]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      requestBody:
        required: true
        content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/DeviceRegistrationUpdate'}}}
      responses:
        '200':
          description: Estado registrado sin inferir capacidad de recepción.
          content: {application/json: {schema: {$ref: '#/components/schemas/DeviceRegistration'}}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Devices]
      operationId: revokeDevice
      summary: Revoca el dispositivo al cerrar sesión o retirar la instalación.
      x-permissions: [devices.manage_own]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '204': {description: Registro revocado de forma idempotente.}
  /devices/{deviceId}/notification-capability:
    get:
      tags: [Devices]
      operationId: getNotificationCapability
      summary: Comprueba por separado permiso, registro y última recepción confirmada.
      x-permissions: [devices.manage_own]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200':
          description: Estado para el paso guiado MUST-NOTIF-01.
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationCapability'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /devices/{deviceId}/push-tests:
    post:
      tags: [Devices]
      operationId: requestPushTest
      summary: Encola una notificación de prueba para una instalación propia.
      description: Solo usa un proveedor falso o destinatarios autorizados fuera de producción.
      x-permissions: [devices.manage_own]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_presentation]
              properties:
                expected_presentation: {type: string, enum: [foreground, background]}
      responses:
        '202':
          description: Prueba encolada; no implica recepción.
          content: {application/json: {schema: {$ref: '#/components/schemas/PushTest'}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /push-tests/{pushTestId}:
    get:
      tags: [Devices]
      operationId: getPushTest
      summary: Consulta el estado comunicado por proveedor y app.
      x-permissions: [devices.manage_own]
      parameters:
        - {$ref: '#/components/parameters/PushTestId'}
      responses:
        '200':
          description: Estado de la prueba concreta.
          content: {application/json: {schema: {$ref: '#/components/schemas/PushTest'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /push-tests/{pushTestId}/confirm:
    post:
      tags: [Devices]
      operationId: confirmPushTestReceipt
      summary: Confirma desde la app la recepción o apertura de la prueba.
      x-permissions: [devices.manage_own]
      parameters:
        - {$ref: '#/components/parameters/PushTestId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, occurred_at]
              properties:
                event: {type: string, enum: [received_foreground, opened_from_background]}
                occurred_at: {$ref: '#/components/schemas/UtcDateTime'}
      responses:
        '200':
          description: Confirmación registrada.
          content: {application/json: {schema: {$ref: '#/components/schemas/PushTest'}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /polls:
    get:
      tags: [Polls]
      operationId: listPolls
      summary: Encuestas de la asociación activa.
      description: |
        La junta ve todas. Un miembro ve solo aquellas en las que es destinatario y que
        ya se abrieron; nunca los borradores.
      x-permissions: [polls.view]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
        - {$ref: '#/components/parameters/PageCursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Encuestas visibles para la cuenta.
          content: {application/json: {schema: {$ref: '#/components/schemas/PollPage'}}}
    post:
      tags: [Polls]
      operationId: createPoll
      summary: Crea una encuesta en borrador.
      x-permissions: [polls.manage]
      parameters:
        - {$ref: '#/components/parameters/AssociationId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PollInput'}}}
      responses:
        '201':
          description: Borrador creado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Poll'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /polls/{pollId}:
    get:
      tags: [Polls]
      operationId: getPoll
      summary: Detalle con el recuento que la cuenta puede ver en este momento.
      x-permissions: [polls.view]
      parameters:
        - {$ref: '#/components/parameters/PollId'}
        - {$ref: '#/components/parameters/AssociationId'}
      responses:
        '200':
          description: Encuesta.
          content: {application/json: {schema: {$ref: '#/components/schemas/Poll'}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Polls]
      operationId: updatePollDraft
      summary: Corrige un borrador. Una encuesta abierta no se modifica.
      x-permissions: [polls.manage]
      parameters:
        - {$ref: '#/components/parameters/PollId'}
        - {$ref: '#/components/parameters/AssociationId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PollInput'}}}
      responses:
        '200':
          description: Borrador actualizado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Poll'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Polls]
      operationId: deletePollDraft
      summary: Borra un borrador. Una encuesta abierta se anula, no se borra.
      x-permissions: [polls.manage]
      parameters:
        - {$ref: '#/components/parameters/PollId'}
        - {$ref: '#/components/parameters/AssociationId'}
      responses:
        '204': {description: Borrador eliminado.}
        '400': {$ref: '#/components/responses/ValidationError'}
  /polls/{pollId}/recipients:
    post:
      tags: [Polls]
      operationId: setPollRecipients
      summary: Sustituye los destinatarios de un borrador por personas, instrumentos o cuerdas.
      description: Solo cuentan fichas activas de la propia asociación; los identificadores ajenos se ignoran.
      x-permissions: [polls.manage]
      parameters:
        - {$ref: '#/components/parameters/PollId'}
        - {$ref: '#/components/parameters/AssociationId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationSelection'}}}
      responses:
        '200':
          description: Número de destinatarios resultante.
          content:
            application/json:
              schema: {type: object, required: [recipients], properties: {recipients: {type: integer, minimum: 0}}}
        '400': {$ref: '#/components/responses/ValidationError'}
  /polls/{pollId}/open:
    post:
      tags: [Polls]
      operationId: openPoll
      summary: Abre la votación y avisa a los destinatarios.
      description: Exige al menos dos opciones, algún destinatario y un cierre posterior a ahora.
      x-permissions: [polls.manage]
      parameters:
        - {$ref: '#/components/parameters/PollId'}
        - {$ref: '#/components/parameters/AssociationId'}
      responses:
        '200':
          description: Votación abierta.
          content: {application/json: {schema: {$ref: '#/components/schemas/Poll'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
  /polls/{pollId}/vote:
    post:
      tags: [Polls]
      operationId: castPollVote
      summary: Emite el voto de la cuenta autenticada. Una sola vez y sin posibilidad de cambiarlo.
      description: |
        El servidor registra por separado que la persona ha votado y una papeleta sin
        votante ni fecha. Por eso la respuesta no dice qué se eligió y ninguna operación
        posterior puede decirlo.
      x-permissions: [polls.view]
      parameters:
        - {$ref: '#/components/parameters/PollId'}
        - {$ref: '#/components/parameters/AssociationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [option_id], properties: {option_id: {$ref: '#/components/schemas/Uuid'}}}
      responses:
        '201':
          description: Voto registrado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Poll'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /polls/{pollId}/publish:
    post:
      tags: [Polls]
      operationId: publishPollResults
      summary: Publica el resultado definitivo una vez vencido el plazo, y lo avisa.
      x-permissions: [polls.manage]
      parameters:
        - {$ref: '#/components/parameters/PollId'}
        - {$ref: '#/components/parameters/AssociationId'}
      responses:
        '200':
          description: Resultado publicado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Poll'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
  /polls/{pollId}/cancel:
    post:
      tags: [Polls]
      operationId: cancelPoll
      summary: Anula un borrador o una encuesta abierta. Una anulada no tiene resultado visible.
      x-permissions: [polls.manage]
      parameters:
        - {$ref: '#/components/parameters/PollId'}
        - {$ref: '#/components/parameters/AssociationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500}}}
      responses:
        '200':
          description: Encuesta anulada.
          content: {application/json: {schema: {$ref: '#/components/schemas/Poll'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso breve, revocable mediante sesión y rotación mantenida.
  parameters:
    AssociationId:
      name: X-Association-ID
      in: header
      required: true
      description: Asociación activa solicitada; el servidor valida pertenencia y permiso.
      schema: {$ref: '#/components/schemas/Uuid'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID nuevo por intención del usuario. Su ámbito incluye cuenta, asociación y operación.
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, example: '"v3"'}
    PageCursor:
      name: page[cursor]
      in: query
      schema: {type: string, maxLength: 500}
    PageSize:
      name: page[size]
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    MemberId: {name: memberId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ImportId: {name: importId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ActivityId: {name: activityId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    InvitationId: {name: invitationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    TransportId: {name: transportId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    AssignmentId: {name: assignmentId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    DeviceId: {name: deviceId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    PollId: {name: pollId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    PushTestId: {name: pushTestId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
  headers:
    ETag:
      description: Versión opaca de la representación.
      schema: {type: string, example: '"v3"'}
    RetryAfter:
      description: Segundos mínimos antes de reintentar.
      schema: {type: integer, minimum: 1}
  responses:
    Unauthorized:
      description: Credenciales ausentes, caducadas o revocadas.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, examples: {unauthorized: {$ref: '#/components/examples/UnauthorizedProblem'}}}}
    Forbidden:
      description: La cuenta no pertenece a la asociación o carece de permiso.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, examples: {forbidden: {$ref: '#/components/examples/ForbiddenProblem'}}}}
    NotFound:
      description: Recurso inexistente o no visible dentro de la asociación activa.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: Estado, capacidad, duplicado o clave idempotente incompatible.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, examples: {capacity: {$ref: '#/components/examples/CapacityProblem'}}}}
    PreconditionFailed:
      description: "If-Match no coincide; recargar antes de editar."
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ValidationError:
      description: La entrada no cumple el contrato o las reglas del dominio.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}, examples: {validation: {$ref: '#/components/examples/ValidationProblem'}}}}
    PayloadTooLarge:
      description: Fichero o petición supera el límite configurado.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    UnsupportedMedia:
      description: Tipo declarado o contenido real no admitido.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    RateLimited:
      description: Demasiadas solicitudes.
      headers: {Retry-After: {$ref: '#/components/headers/RetryAfter'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  examples:
    UnauthorizedProblem:
      value: {type: 'https://docs.example.invalid/problems/unauthorized', title: No autenticado, status: 401, code: auth.invalid_credentials, trace_id: trace-synthetic-001}
    ForbiddenProblem:
      value: {type: 'https://docs.example.invalid/problems/forbidden', title: Acceso denegado, status: 403, code: association.access_denied, trace_id: trace-synthetic-002}
    CapacityProblem:
      value: {type: 'https://docs.example.invalid/problems/conflict', title: Conflicto, status: 409, code: transport.capacity_exceeded, detail: No quedan plazas disponibles., trace_id: trace-synthetic-003}
    ValidationProblem:
      value:
        type: https://docs.example.invalid/problems/validation
        title: Datos no válidos
        status: 422
        code: validation.failed
        trace_id: trace-synthetic-004
        errors: [{field: starts_at, code: invalid_datetime, message: Debe ser una fecha RFC 3339 en UTC.}]
  schemas:
    Uuid: {type: string, format: uuid}
    UtcDateTime:
      type: string
      format: date-time
      pattern: 'Z$'
      examples: ['2026-10-17T17:00:00Z']
    Problem:
      type: object
      required: [type, title, status, code, trace_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string, pattern: '^[a-z][a-z0-9_.-]+$'}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
    PageMeta:
      type: object
      required: [page_size, has_more]
      properties:
        page_size: {type: integer, minimum: 0, maximum: 100}
        has_more: {type: boolean}
        next_cursor: {type: [string, 'null']}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, writeOnly: true}
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
