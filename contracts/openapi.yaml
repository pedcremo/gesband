        participation:
          type: object
          required: [recipients, voted]
          properties:
            recipients: {type: integer, minimum: 0}
            voted: {type: integer, minimum: 0}
        has_voted: {type: [boolean, 'null'], description: Null si la cuenta no es destinataria. Nunca se indica qué opción eligió.}
        can_vote: {type: boolean}
        recipients:
          description: |
            Quién ha votado y quién no. Solo para la junta y solo con la votación cerrada:
            mientras se vota, cruzarlo con el recuento provisional delataría votos.
          anyOf: [{type: array, items: {$ref: '#/components/schemas/PollRecipientStatus'}}, {type: 'null'}]
    PollPage:
      type: object
      required: [results, page]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/Poll'}}
        page: {$ref: '#/components/schemas/PageMeta'}
