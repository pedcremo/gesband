name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.backend.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: backend
        shell: bash
        run: |
          if [[ -f backend/manage.py && -f backend/requirements.txt ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Backend todavía no creado; CI queda preparada para activarse automáticamente."
          fi
      - name: Validar Docker Compose
        run: docker compose -f infra/compose.yaml config --quiet

  backend:
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gesband_test
          POSTGRES_USER: gesband_test
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gesband_test -d gesband_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: gesband_test
          RABBITMQ_DEFAULT_PASS: synthetic-test-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: synthetic-ci-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://gesband_test:synthetic-test-password@127.0.0.1:5432/gesband_test
      CELERY_BROKER_URL: amqp://gesband_test:synthetic-test-password@127.0.0.1:5672//
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      PUSH_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement backend/requirements.txt
          if [[ -f backend/requirements-dev.txt ]]; then
            python -m pip install --requirement backend/requirements-dev.txt
          fi
      - name: Comprobar formato y análisis estático
        run: |
          if python -c 'import ruff' 2>/dev/null; then
            python -m ruff format --check backend
            python -m ruff check backend
          else
            echo "Ruff no está declarado; se mantienen las comprobaciones propias de Django."
          fi
      - name: Comprobar Django y migraciones
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Compilar traducciones
        working-directory: backend
        # Los .mo no se versionan; sin ellos las pruebas en valenciano e ingles fallan.
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends gettext
          python manage.py compilemessages
      - name: Ejecutar pruebas backend
        working-directory: backend
        run: |
          if python -c 'import pytest' 2>/dev/null; then
            python -m pytest
          else
            python manage.py test
          fi

